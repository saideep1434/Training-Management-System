 <mat-sidenav-container
  class="mainWrapper blue_theme light-theme"
  autosize
  autoFocus
  dir="ltr"
>

  <mat-sidenav
    #leftsidenav
    [mode]="isOver ? 'over' : 'side'"
    [opened]="!isOver"
    (openedChange)="onSidenavOpenedChange($event)"
    (closedStart)="onSidenavClosedStart()"
    class="sidebarNav"
  >
    <div class="flex-layout">
      <app-sidebar
        (toggleMobileNav)="sidenav.toggle()"
        [showToggle]="isOver"
      ></app-sidebar>
      <ng-scrollbar class="position-relative" style="height: 100%">
        <mat-nav-list class="sidebar-list">
          @for(item of navItems$ | async; track item) {
          <app-nav-item [item]="item" (notify)="sidenav.toggle()">
          </app-nav-item>
          }
        </mat-nav-list>
      </ng-scrollbar>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="contentWrapper" #content>

    <app-header
      [showToggle]="!isOver"
      (toggleCollapsed)="toggleCollapsed()"
      (toggleMobileNav)="sidenav.toggle()"
    ></app-header>

    <!-- Global Guest Banner -->
    <div *ngIf="isReadOnly" class="global-guest-banner">
      <mat-icon>visibility</mat-icon>
      <span>You are browsing in <strong>Read-Only Mode</strong> as a Guest. You cannot create, edit, or delete any data.</span>
    </div>

    <main class="pageWrapper maxWidth">

     <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
