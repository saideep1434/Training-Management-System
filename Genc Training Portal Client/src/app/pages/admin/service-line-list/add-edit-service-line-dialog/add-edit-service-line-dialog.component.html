<h2 mat-dialog-title>{{ dialogTitle }}</h2>

<div mat-dialog-content>
  <form [formGroup]="serviceLineForm">
    <!-- ServiceLine ID field (only visible and disabled in edit mode) -->
    <mat-form-field appearance="outline" *ngIf="isEditMode">
      <mat-label>Service Line ID</mat-label>
      <input matInput formControlName="serviceLineId" readonly>
      <mat-error *ngIf="serviceLineForm.get('serviceLineId')?.hasError('required') && serviceLineForm.get('serviceLineId')?.touched">
        Service Line ID is required.
      </mat-error>
    </mat-form-field>

    <!-- Track Name field -->
    <mat-form-field appearance="outline">
      <mat-label>Track Name</mat-label>
      <input matInput formControlName="trackName" required>
      <mat-error *ngIf="serviceLineForm.get('trackName')?.hasError('required') && serviceLineForm.get('trackName')?.touched">
        Track Name is required.
      </mat-error>
    </mat-form-field>

    <!-- Domain Name Dropdown -->
    <mat-form-field appearance="outline">
      <mat-label>Domain Name</mat-label>
      <mat-select formControlName="domainName" required>
        <!-- Use async pipe to unwrap the Observable and loop through domains -->
        <mat-option *ngFor="let domain of (domains$ | async)" [value]="domain.domainName">
          {{ domain.domainName }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="serviceLineForm.get('domainName')?.hasError('required') && serviceLineForm.get('domainName')?.touched">
        Domain Name is required.
      </mat-error>
    </mat-form-field>
  </form>
</div>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-flat-button color="primary" [disabled]="serviceLineForm.invalid" (click)="onSave()">
    {{ isEditMode ? 'Update' : 'Add' }} Service Line
  </button>
</mat-dialog-actions>
