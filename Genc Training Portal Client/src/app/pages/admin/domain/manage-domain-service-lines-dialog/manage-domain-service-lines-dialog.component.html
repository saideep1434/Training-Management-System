<h2 mat-dialog-title>Manage Service Lines for: {{ domain.domainName }} ({{ domain.domainId }})</h2>

<mat-dialog-content class="service-line-dialog-content">
    <div class="service-line-controls">
        <mat-form-field appearance="outline" class="service-line-search-input">
            <mat-icon matPrefix>search</mat-icon>
            <input matInput placeholder="Search service lines" [(ngModel)]="searchQuery" (keyup)="applyFilters()">
        </mat-form-field>

        <button mat-flat-button color="primary" (click)="addServiceLine()">
            <mat-icon>add</mat-icon> Add Service Line
        </button>
    </div>

    <div class="data-table-section mat-elevation-z2">
        <div class="found-count">Found: {{ dataSource.filteredData.length }} Service Lines</div>
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- ID Column -->
            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
                <td mat-cell *matCellDef="let element"> {{element.name}} </td>
            </ng-container>

            <!-- Description Column -->
            <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Description </th>
                <td mat-cell *matCellDef="let element"> {{element.description}} </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button color="accent" (click)="onEditServiceLine(element)"
                        title="Edit Service Line">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button color="warn" (click)="onDeleteServiceLine(element)"
                        title="Delete Service Line">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">No data matching the filter
                    "{{searchQuery}}"</td>
            </tr>
        </table>
    </div>
    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons (page)="onPageChange($event)"></mat-paginator>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-flat-button color="primary" (click)="onClose()">Done</button>
</mat-dialog-actions>
