<div class="profile-container">
  <mat-card class="cardWithShadow">
    <mat-card-header>
      <div mat-card-avatar class="avatar-circle">{{ displayName | slice:0:1 }}</div>
      <mat-card-title>My Profile</mat-card-title>
      <mat-card-subtitle>Personal details</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="details-grid">
        <div class="detail">
          <mat-icon>person</mat-icon>
          <div>
            <div class="label">Name/Username</div>
            <div class="value">{{ displayName }}</div>
          </div>
        </div>
        <div class="detail">
          <mat-icon>badge</mat-icon>
          <div>
            <div class="label">Associate ID</div>
            <div class="value">{{ associateId }}</div>
          </div>
        </div>
        <div class="detail">
          <mat-icon>verified_user</mat-icon>
          <div>
            <div class="label">Roles</div>
            <div class="value">
              <mat-chip-set>
                <mat-chip *ngFor="let r of roles" appearance="outlined" color="primary" selected>{{ r }}</mat-chip>
              </mat-chip-set>
            </div>
          </div>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
