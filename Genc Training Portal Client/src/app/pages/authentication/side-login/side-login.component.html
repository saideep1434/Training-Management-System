<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <a [routerLink]="['/dashboard']">
              <img src="./assets/images/logos/Cognizant_Logo.png" class="align-middle m-2" alt="logo" height="75"
                width="250" />
            </a>
          </div>

          <h3 class="mat-headline-2 f-s-20 f-w-600 text-center m-b-12">
            Training Management Portal
          </h3>

          <form class="m-t-30" [formGroup]="loginForm" (ngSubmit)="submitForm()">
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput formControlName="email" />
              <mat-error *ngIf="f['email'].invalid && (f['email'].dirty || f['email'].touched)">
                <span *ngIf="f['email'].errors?.['required']">Email is required.</span>
                <span *ngIf="f['email'].errors?.['minlength']">Email must be at least 6 characters long.</span>
              </mat-error>
            </mat-form-field>

            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
            <mat-form-field appearance="outline" class="w-100" color="primary">
              <input matInput type="password" formControlName="password" />
              <mat-error *ngIf="f['password'].invalid && (f['password'].dirty || f['password'].touched)">
                <span *ngIf="f['password'].errors?.['required']">Password is required.</span>
              </mat-error>
            </mat-form-field>

            <div class="d-flex align-items-center m-b-12">
              <mat-checkbox color="primary">Remember Me</mat-checkbox>
              <a [routerLink]="['/authentication/forgot-password']"
                class="text-primary f-w-600 text-decoration-none m-l-auto f-s-14">Forgot
                Password ?</a>
            </div>

            <button mat-flat-button color="primary" class="w-100" type="submit" [disabled]="loginForm.invalid">
              Sign In
            </button>

            <div class="text-center m-t-16">
              <span class="f-s-14">Are you a visitor, please continue as <span class="guest-link" (click)="onGuestLogin()">Guest</span></span>
            </div>

          </form>


        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
