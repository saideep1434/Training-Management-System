<mat-card class="cohort-card cardWithShadow">
  <mat-card-content>
    <div class="header">
      <div class="left">
        <div class="title">
          <mat-icon color="primary">groups</mat-icon>
          <h3>{{ cohort.cohortCode }}</h3>
        </div>
        <div class="chips">
          <mat-chip-set>
            <mat-chip appearance="outlined">
              <mat-icon class="m-r-5">view_quilt</mat-icon>{{ cohort.vertical }}
            </mat-chip>
            <mat-chip appearance="outlined">
              <mat-icon class="m-r-5">construction</mat-icon>{{ cohort.serviceLine }}
            </mat-chip>
            <mat-chip appearance="outlined">
              <mat-icon class="m-r-5">badge</mat-icon>{{ cohort.hireType }}
            </mat-chip>
          </mat-chip-set>
        </div>
      </div>
      <div class="right">
        <button *ngIf="!isReadOnly && canManageCohorts" mat-icon-button [matMenuTriggerFor]="menu" aria-label="Cohort actions">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="viewDetails(cohort.cohortId)">View details</button>
          <button mat-menu-item (click)="editCohort(cohort.cohortId)">Edit</button>
          <button mat-menu-item (click)="deleteCohort(cohort.cohortId)">Delete</button>
        </mat-menu>
      </div>
    </div>

    <div class="meta">
      <div class="info"><mat-icon>location_on</mat-icon>{{ cohort.location }}</div>
      <div class="info"><mat-icon>confirmation_number</mat-icon>#{{ cohort.cohortId }}</div>
    </div>

    <div class="actions">
      <button mat-stroked-button color="primary" (click)="viewDetails(cohort.cohortId)">
        View details
      </button>
    </div>
  </mat-card-content>
</mat-card>
