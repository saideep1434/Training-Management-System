<h2 mat-dialog-title>Add New Trainer</h2>
<mat-dialog-content>
    <form #trainerForm="ngForm">
        <mat-form-field *ngFor="let inputElement of inputElements | keyvalue" appearance="outline">
            <mat-label>{{inputElement.value[0]}}</mat-label>
            <input
            matInput
            [type]="inputElement.value[1]"
            [(ngModel)]="formData[inputElement.key]"
            [name]="inputElement.key"
            required
            >
        </mat-form-field>
