
<div class="row">
    @for(productcard of productcards; track productcards) {
    <div class="col-sm-6 col-lg-3">
        <mat-card class="cardWithShadow productcard overflow-hidden">
            <!-- <a routerLink="/widgets/cards">
                <img src="{{ productcard.imgSrc }}" alt="imgSrc" class="w-100" mat-card-image />
            </a> -->
            <mat-card class="mat-elevation-z4">
                <mat-card-header>
                  <mat-icon color="primary">{{ productcard.icon }}</mat-icon>
                  <mat-card-title>{{ productcard.title }}</mat-card-title>
                </mat-card-header>

                <mat-divider></mat-divider>

                                <mat-card-content>
                                        <p>
                                            <strong>Total : </strong>
                                            <ng-container *ngIf="productcard.total !== null; else totalNA">{{ productcard.total }}</ng-container>
                                            <ng-template #totalNA><span class="na">N/A</span></ng-template>
                                        </p>
                                        <p>
                                            <strong>Available : </strong>
                                            <ng-container *ngIf="productcard.available !== null; else availNA">
                                                <span class="available-text">{{ productcard.available }}</span>
                                            </ng-container>
                                            <ng-template #availNA><span class="na">N/A</span></ng-template>
                                        </p>
                                    </mat-card-content>
                </mat-card>
