<mat-card class="cardWithShadow">
    <mat-card-header>
        <mat-card-title>LOCATIONS</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div *ngIf="dataNotice" class="data-notice">{{ dataNotice }}</div>

        <div class="row m-t-24 align-items-center">
            <div class="col-7">
                <div class="col-7 d-flex align-items-center me-3"></div>
              <div *ngFor="let location of locations" class="d-flex align-items-center mb-2">
                <div class="col-7 d-flex align-items-center">
                  <mat-icon [style.color]="location.color" style="font-size: 15px;">circle</mat-icon>
                  <div class="mat-body-1 m-l-12 f-w-600">{{ location.name }}</div>
                </div>
      
                <div class="col-5">
                  <div class="d-flex align-items-baseline">
                    <h4 class="mat-headline-5 f-w-600 m-0">{{ location.count }}</h4>
                    <span class="mat-body-1 m-l-8 text-muted">Cohorts</span>
                  </div>
                </div>
      
                </div>
            </div>
